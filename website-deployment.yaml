# Deploy website playbook
- name: Install and configure web server
  hosts: web
  become: yes
  tasks:
    - name: Install Apache web server
      apt:
        name: apache2
        state: present
        update_cache: yes
    - name: Ensure Apache is running
      service:
        name: apache2
        state: started
        enabled: yes
    - name: Deploy custom index.html
      copy:
        src: ./website/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: '0644'
    - name: Verify Apache is serving the website
      uri:
        url: http://localhost:8081
        return_content: yes
      register: webpage